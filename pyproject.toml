[project]
name = "gulag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alex010501", email = "alexmazurin0105@gmail.com" }
]
requires-python = ">=3.12, <3.13"
dependencies = [
    "numpy>=2.5.5",
    "pygfx>=0.18.0",
    "pyside6-essentials>=6.12.0",
    "rendercanvas>=3.0.1",
    "wgpu>=0.33.0",
]

[project.scripts]
gulag = "gulag:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
data = { purelib = "resources/runtime" }

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "pytest>=9.2.0",
    "pytest-qt>=4.5.0",
]
